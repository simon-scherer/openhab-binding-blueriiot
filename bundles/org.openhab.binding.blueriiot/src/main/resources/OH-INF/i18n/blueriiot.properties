# add-on

addon.blueriiot.name = Blue Riiot Binding
addon.blueriiot.description = Pool water measurements of Blue Riiot / Blue Connect sensors via the (unofficial) Blue Riiot cloud API.

# thing types

thing-type.blueriiot.account.label = Blue Riiot Account
thing-type.blueriiot.account.description = Blue Connect cloud account (same login as the Blue Connect app).
thing-type.blueriiot.blueconnect.label = Blue Connect
thing-type.blueriiot.blueconnect.description = Blue Connect pool water analyser.
thing-type.blueriiot.blueconnect.channel.temperature-status.label = Temperature Status
thing-type.blueriiot.blueconnect.channel.ph-status.label = pH Status
thing-type.blueriiot.blueconnect.channel.orp-status.label = ORP Status
thing-type.blueriiot.blueconnect.channel.free-chlorine.label = Free Chlorine
thing-type.blueriiot.blueconnect.channel.free-chlorine.description = Free chlorine (test strip).
thing-type.blueriiot.blueconnect.channel.free-chlorine-status.label = Free Chlorine Status
thing-type.blueriiot.blueconnect.channel.combined-chlorine.label = Combined Chlorine
thing-type.blueriiot.blueconnect.channel.combined-chlorine.description = Combined chlorine (test strip).
thing-type.blueriiot.blueconnect.channel.total-chlorine.label = Total Chlorine
thing-type.blueriiot.blueconnect.channel.total-chlorine.description = Total chlorine (test strip).
thing-type.blueriiot.blueconnect.channel.alkalinity.label = Total Alkalinity
thing-type.blueriiot.blueconnect.channel.alkalinity.description = Total alkalinity TA (test strip).
thing-type.blueriiot.blueconnect.channel.alkalinity-status.label = Alkalinity Status
thing-type.blueriiot.blueconnect.channel.cyanuric-acid.label = Cyanuric Acid
thing-type.blueriiot.blueconnect.channel.cyanuric-acid.description = Cyanuric acid / stabiliser (test strip).
thing-type.blueriiot.blueconnect.channel.calcium-hardness.label = Calcium Hardness
thing-type.blueriiot.blueconnect.channel.calcium-hardness.description = Calcium hardness (test strip).

# thing types config

thing-type.config.blueriiot.account.email.label = E-Mail
thing-type.config.blueriiot.account.email.description = E-mail address of the Blue Connect account.
thing-type.config.blueriiot.account.password.label = Password
thing-type.config.blueriiot.account.password.description = Password of the Blue Connect account.
thing-type.config.blueriiot.account.refreshInterval.label = Refresh Interval
thing-type.config.blueriiot.account.refreshInterval.description = Polling interval in minutes. The sensor itself only measures a few times per day.
thing-type.config.blueriiot.account.language.label = Language
thing-type.config.blueriiot.account.language.description = Language for texts returned by the cloud.
thing-type.config.blueriiot.blueconnect.serial.label = Serial Number
thing-type.config.blueriiot.blueconnect.serial.description = Serial number of the Blue Connect device as used by the cloud (the "key" in the app, e.g. 0A1B2C3D). Listed in the bridge property "devices".
thing-type.config.blueriiot.blueconnect.fetchInterval.label = Fetch Interval
thing-type.config.blueriiot.blueconnect.fetchInterval.description = Every n hours, ask the Blue Extender to hand over its newest measurement (0 = off). Requires a Blue Extender.

# channel types

channel-type.blueriiot.temperature.label = Water Temperature
channel-type.blueriiot.ph.label = pH
channel-type.blueriiot.ph.description = pH value of the water.
channel-type.blueriiot.orp.label = ORP / Redox
channel-type.blueriiot.orp.description = Oxidation-reduction potential (disinfection indicator).
channel-type.blueriiot.conductivity.label = Conductivity
channel-type.blueriiot.conductivity.description = Electrical conductivity in µS/cm.
channel-type.blueriiot.salinity.label = Salinity
channel-type.blueriiot.salinity.description = Salinity in g/l (salt water pools).
channel-type.blueriiot.salt.label = Salt
channel-type.blueriiot.salt.description = Salt content in ppm.
channel-type.blueriiot.tds.label = TDS
channel-type.blueriiot.tds.description = Total dissolved solids in ppm.
channel-type.blueriiot.mgl.label = Concentration
channel-type.blueriiot.mgl.description = Concentration in mg/l (from manual test strip entries).
channel-type.blueriiot.measurement-status.label = Measurement Status
channel-type.blueriiot.measurement-status.description = Assessment by the cloud ranges: OK, WARNING or CRITICAL.
channel-type.blueriiot.measurement-status.state.option.OK = OK
channel-type.blueriiot.measurement-status.state.option.WARNING = Warning
channel-type.blueriiot.measurement-status.state.option.CRITICAL = Critical
channel-type.blueriiot.last-measurement.label = Last Measurement
channel-type.blueriiot.last-measurement.description = Time of the last measurement that reached the cloud.
channel-type.blueriiot.fetch-measurement.label = Fetch Newest Measurement
channel-type.blueriiot.fetch-measurement.description = ON asks the Blue Extender to hand over its newest stored measurement (like "Wi-Fi" in the app). It does not start a new measurement. Resets to OFF.

# thing status descriptions

offline.conf-error.credentials-missing = Configure e-mail and password of the Blue Connect account.
offline.conf-error.login-failed = Login rejected, check e-mail and password. Polling stopped until the configuration is changed.
offline.conf-error.serial-missing = Configure the serial number of the Blue Connect device.
offline.conf-error.bridge-missing = The thing needs a Blue Riiot account bridge.
offline.conf-error.device-not-found = Blue Connect {0} not found in the account (see bridge property "devices").
